[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "celistdb"
version = "1.0.0"
description = "pandas-powered export utilities for celist.db databases (Excel .xlsx)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "R Sashank Adithiyaa" }]
keywords = ["sqlite", "pandas", "excel", "xlsx", "database", "celist.db"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
  "Topic :: Office/Business",
]
dependencies = [
  "pandas>=2.0",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
analytics = ["pyarrow>=14"]
dev = ["pytest>=8"]

[project.scripts]
celist = "celistdb.cli:main"

[tool.setuptools.packages.find]
include = ["celistdb*"]
