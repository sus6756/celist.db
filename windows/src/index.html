<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:;">
  <title>celist.db</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Ribbon -->
    <div id="ribbon">
      <div id="app-strip">
        <span class="app-logo">🛡️</span>
        <span class="app-name">celist.db</span>
        <span class="app-sep"></span>
        <button class="qa-btn" id="qa-open" title="Open…">📂</button>
        <button class="qa-btn" id="qa-new" title="Create database…">➕</button>
        <div class="app-spacer"></div>
        <span class="db-name" id="db-name"></span>
      </div>
      <div id="tab-strip"></div>
      <div id="group-area"></div>
    </div>

    <!-- Main -->
    <div id="main">
      <div id="nav-pane"></div>
      <div id="detail"></div>
    </div>

    <!-- Status bar -->
    <div id="status-bar">
      <div id="status-left"></div>
      <div id="status-right"><span id="status-message"></span><span id="obj-count"></span></div>
    </div>
  </div>

  <!-- Dialogs / overlays -->
  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="../node_modules/sql.js/dist/sql-wasm.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
